<script> 
    


    function getComputerChoice() {
        let first = "paper";
        let second = "rock";
        let third = "scissors";
        
        
        
        const choice = Math.random();

        if ( choice < 1/3 ) {
            return first;
        } else if (choice < 2/3 ) {
            return second;
        } else {
            return third;
        }
        
        return choice.toLowerCase();
    }
    let humanScore = 0;
    let computerScore = 0;
    
    
    function playRound(humanChoice, computerChoice) {

            

            if (humanChoice === computerChoice) {
                console.log(`Draw - ${humanChoice} is the same as ${computerChoice}`)
        
            } else if (humanChoice === "paper" && computerChoice === "rock") {
                console.log(`You Win - ${computerChoice} beats ${humanChoice}!`);
                humanScore += 1;
                updateScore();

        
            } else if (humanChoice === "rock" && computerChoice === "scissors") {
                console.log(`You win - ${humanChoice} beats ${computerChoice}!`);
                humanScore += 1;
                updateScore();
        
            } else if (humanChoice === "scissors" && computerChoice === "paper") {
                console.log(`You win - ${humanChoice} beats ${computerChoice}!`);
                humanScore += 1;
                updateScore();
        
            } else {
                console.log(`You Lose - ${computerChoice} beats ${humanChoice}!`);
                computerScore += 1;
                updateScore();
            }

            
        }
    
    function updateScore() {
        subContainer.textContent = (`Human Score: ${humanScore}\nComputer Score: ${computerScore}`);
    }
    
    const container = document.createElement("div");

    const subContainer = document.createElement("div");

    subContainer.style.backgroundColor = "white";
    
    
    container.appendChild(subContainer);
    container.style.padding = "48px 48px";
    container.style.backgroundColor = "orange";
    
    container.id = "container";

    document.body.appendChild(container);
        
    const btn = document.createElement("button");
    const btnTwo = document.createElement("button");
    const btnThree = document.createElement("button");

    btn.textContent = "Paper";
    btnTwo.textContent = "Rock";
    btnThree.textContent = "Scissors";

    container.append(btn, btnTwo, btnThree);
    //Function now has too have 3 buttons for player to play
    //On button click needs to return a string

    btn.addEventListener("click", () => {
        playRound("paper", getComputerChoice());
    });
        
    btnTwo.addEventListener("click", () => { 
        playRound("rock", getComputerChoice());
    });
        
    btnThree.addEventListener("click", () => {
        playRound("scissors", getComputerChoice());
    });
    
   


    

    

    
    


</script>
